  reload-success: "ZyroxShop neu geladen."

gui:
  editor:
    title: "Shop Editor #{shop_id}"
    selling-name: "Verkauft: {item}"
    selling-lore:
      - "Klicke mit einem Item in der Hand,"
      - "um das Shop-Item zu ersetzen."
      - "{enchant_lines}"
      - "Das Lager muss dafür leer sein."
    price-down-name: "Preis -1"
    price-info-name: "Preis"
    price-up-name: "Preis +1"
    bundle-down-name: "Paket -1"
    bundle-info-name: "Paket"
    bundle-up-name: "Paket +1"
    current-price: "Aktuell: {price}"
    current-bundle: "Aktuell: {bundle} Item(s)"
    discount-name: "Rabatt"
    discount-lore:
      - "Aktuell: {discount}"
      - "Effektiver Preis: {effective_price}"
      - "Klicke zum Bearbeiten."
    deposit-name: "Alle passenden Items einlagern"
    deposit-lore:
      - "Passende Items werden aus deinem"
      - "Inventar entfernt und virtuell gespeichert."
    withdraw-bundle-name: "Ein Paket entnehmen"
    withdraw-bundle-lore:
      - "Entnimmt {bundle} Item(s)."
    withdraw-all-name: "Alles entnehmen"
    withdraw-all-lore:
      - "Lager: {stock}"
    revenue-name: "Diamanten auszahlen"
    revenue-lore:
      - "Gespeichert: {revenue}"
    history-name: "Kaufhistorie"
    history-lore:
      - "Oeffnet die letzten Kaeufe"
      - "dieses Shops."
    delete-name: "Shop löschen"
    delete-lore:
      - "Funktioniert nur ohne Lager"
      - "und ohne gespeicherte Diamanten."
    history:
      title-name: "Kaufhistorie - Seite {page}"
      title-lore:
        - "Shop #{shop_id}"
      empty-name: "Keine Kaeufe"
      empty-lore:
        - "Auf dieser Seite gibt es"
        - "keine Eintraege."
      entry-name: "{buyer}"
      entry-lore:
        - "{created_at}"
        - "{amount} Item(s)"
        - "{price}"
    discount-menu:
      percent-down-name: "Rabatt -5%"
      percent-info-name: "Rabatt: {selected_discount_percent}%"
      percent-up-name: "Rabatt +5%"
      percent-lore:
        - "Ausgewaehlt: {selected_discount_percent}%"
        - "Dauer: {selected_discount_duration}"
      duration-name: "{duration}"
      duration-lore:
        - "Ausgewaehlt: {selected}"
      duration-permanent: "Permanent"
      duration-30m: "30 Minuten"
      duration-2h: "2 Stunden"
      duration-7d: "7 Tage"
      save-name: "Rabatt speichern"
      save-lore:
        - "{selected_discount_percent}%"
        - "{selected_discount_duration}"
      clear-name: "Rabatt entfernen"
      clear-lore:
        - "Setzt den aktiven Rabatt"
        - "zurueck."
  purchase:
    title: "Shop #{shop_id}"
    item-lore:
      - "Material: {material}"
      - "{enchant_lines}"
      - "Preis: {effective_price}"
      - "Original: {original_price}"
      - "Rabatt: {discount}"
      - "Lager: {stock}"
      - "Bewertung: {rating} ({rating_count})"
      - "Favorit: {favorite}"
    buy-name: "{bundles} Paket(e) kaufen"
    buy-max-name: "Maximum kaufen"
    buy-lore:
      - "{amount} Item(s)"
      - "{price}"
    favorite-add-name: "Favorit setzen"
    favorite-remove-name: "Favorit entfernen"
    favorite-lore:
      - "Aktuell: {favorite}"
    rating-name: "Bewerten"
    rating-lore:
      - "Aktuell: {rating} ({rating_count})"
    favorites-name: "Meine Favoriten"
    favorites-lore:
      - "Oeffnet deine gemerkten Shops."
  rating:
    item-lore:
      - "Aktuell: {rating} ({rating_count})"
      - "Favorit: {favorite}"
    rate-name: "{rating_value} Stern(e)"
    rate-lore:
      - "Speichert diese Bewertung."
  favorites:
    title-name: "Meine Favoriten - Seite {page}"
    title-lore:
      - "Klicke einen Shop zum Oeffnen."
    empty-name: "Keine Favoriten"
    empty-lore:
      - "Auf dieser Seite gibt es"
      - "keine Favoriten."
    entry-name: "#{shop_id}: {bundle}x {item}"
    entry-lore:
      - "Preis: {effective_price}"
      - "Lager: {stock}"
      - "Besitzer: {owner}"
      - "{world}:{x}/{y}/{z}"
  common:
    back-name: "Zurueck"
    back-lore:
      - "Zur vorherigen Ansicht."
    previous-page-name: "Vorherige Seite"
    previous-page-lore:
      - "Eine Seite zurueck."
    next-page-name: "Naechste Seite"
    next-page-lore:
      - "Eine Seite weiter."

permissions:
  use: "zyrox.shop.use"
  create: "zyrox.shop.create"
  admin: "zyrox.shop.admin"
  web: "zyrox.shop.web"
