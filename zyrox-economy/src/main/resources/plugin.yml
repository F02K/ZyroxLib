name: ZyroxEconomy
version: 0.1.0-SNAPSHOT
main: de.tecca.zyrox.economy.plugin.ZyroxEconomyPlugin
api-version: '1.21'
author: tecca
load: STARTUP
depend:
  - ZyroxAPI
libraries:
  - org.xerial:sqlite-jdbc:3.53.2.0
commands:
  economy:
    description: Manages the Zyrox diamond payment service.
    usage: /economy reload
permissions:
  zyrox.economy.admin:
    description: Allows managing ZyroxEconomy.
    default: op
  zyrox.economy.web:
    description: Allows viewing ZyroxEconomy in the Zyrox dashboard.
    default: op
