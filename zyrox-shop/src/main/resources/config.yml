storage:
  sqlite-file: "zyrox-shop.db"

shop:
  default-price-diamonds: 1
  empty-stock-auto-close-days: 5
  empty-stock-check-interval-minutes: 10
  empty-stock-warning-interval-hours: 24
  empty-stock-login-warning-delay-ticks: 60
  empty-stock-warning-sound: "BLOCK_NOTE_BLOCK_PLING"
  hologram-text-offset-y: 1.5
  hologram-text-scale: 1.0
  item-display-offset-y: 1.25
  item-display-scale: 0.5

holograms:
  backend: "auto"
  lines:
    - "Besitzer: {owner}"
    - "{bundle}x {item}"
    - "{enchant_lines}"
    - "Preis: {effective_price}"
    - "Rabatt: {discount}"
    - "Bewertung: {rating} ({rating_count})"
    - "Lager: {stock}"
    - "{empty_stock_lines}"
  empty-stock-line: "Schliesst in: {empty_stock_time_left}"

messages:
  create-not-chest: "Dieser Block ist keine Truhe."
  create-not-empty: "Erstelle Shops nur aus leeren Truhen. Das Lager wird virtuell gespeichert."
